# Local dev stack: Postgres + game server + web client.
#   docker compose up --build
# Then open http://localhost:3000 (phones on your LAN: http://<your-ip>:3000)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: partygame
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  server:
    build:
      context: .
      target: server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/partygame
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        # Empty = browser uses <page host>:4000, which works on a LAN.
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
